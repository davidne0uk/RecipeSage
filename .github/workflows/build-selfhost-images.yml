# Builds this fork's selfhost images (api + static) and pushes them to GHCR
# for the NAS deployment in deploy/nas/. Mirrors upstream's CircleCI selfhost
# jobs, amd64-only (the NAS is x86_64).
name: build-selfhost-images

on:
  push:
    branches: [smart-pantry]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/davidne0uk/recipesage
  TAG_SUFFIX: smart-pantry

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: production.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.TAG_SUFFIX }}
          tags: ${{ env.IMAGE }}:api-${{ env.TAG_SUFFIX }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (selfhost configuration)
        run: pnpm exec nx build:selfhost frontend --skip-nx-cache
        env:
          APP_VERSION: ${{ env.TAG_SUFFIX }}
          ENVIRONMENT: production
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Stage frontend build for docker context
        # The version must be semver-coercible >=3.0.0 or the app's
        # versioncheck endpoint reports it unsupported and the UI loops on an
        # "app is out of date" alert. 3.99.x marks fork builds, incrementing
        # per workflow run.
        run: |
          mv packages/frontend/www ./www
          sed -i "s/window.version = \"development\";/window.version = \"3.99.${{ github.run_number }}\";/" www/index.html
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/frontend/selfhost.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:static-${{ env.TAG_SUFFIX }}
