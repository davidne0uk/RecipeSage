# Custom proxy config for this fork: current RecipeSage builds serve the PWA
# under /app/ (base href), which the published selfhost-proxy image predates.
# Mounted over the image's default config by the compose file.
server {
  client_max_body_size 1G;

  listen 80 default_server;

  server_name localhost;

  # Keep redirects relative so the external port (7270) survives
  absolute_redirect off;

  location /grip/ws {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_connect_timeout 1h;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
    proxy_pass http://pushpin:7999/ws;
  }

  location /api/ {
    proxy_pass http://api:3000/;
  }

  # The PWA lives under /app/ (frontend base href); strip the prefix for the
  # static server, which handles SPA fallback.
  location = / {
    return 302 /app/;
  }

  location /app/ {
    rewrite ^/app/(.*)$ /$1 break;
    proxy_pass http://static:80;
  }

  # Root-absolute references from index.html (e.g. /manifest.json)
  location / {
    proxy_pass http://static:80/;
  }
}
